# SpeechTokenizer model configuration, read by the SpeechTokenizer arm of train_converter.yaml.

n_filters: 64
strides:
- 8
- 5
- 4
- 2
dimension: 1024
codes_transform_dimensions:
- 768
dataset_distillation_keys:
- hubert_1
bidirectional: true
dilation_base: 2
residual_kernel_size: 3
n_residual_layers: 1
lstm_layers: 2
activation: ELU
codebook_size: 1024
n_q: 8
num_mels: 80
num_freq: 1025
n_fft: 1024
hop_size: 240
win_size: 1024
fmin: 0
fmax: 8000
fmax_for_loss: null
loss_lambdas:
  mel_loss_lambdas:
  - 45
  - 1
  - 1
  - 1
  recon_loss_lambda: 500
  commitment_loss_lambda: 10
  distill_loss_lambda: 120
distill_type: d_axis
semantic_model_layer: avg
hubert_model_name_or_path: facebook/hubert-base-ls960
